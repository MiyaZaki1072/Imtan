  - ตัวนำหน้าคิว
  - เปิดหมายเหตุและช่องแพ้อาหารเหมือนเจ๊บึก
  ingredients:
  - ไก่กรอบ
  - ปลาทอด
  - หมูญี่ปุ่น
  - หมูบาบีคิว
  - ไก่ทอดเกาหลี
  - ไข่ข้น
  - แกงกะหรี่
  menus:
  - name: ข้าวราด เลือกโปรตีน
    category: ข้าวราด
    cook_seconds: 90
    groups:
    - name: โปรตีน
