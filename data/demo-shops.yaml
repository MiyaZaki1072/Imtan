        price: 0
        ingredient: หมูญี่ปุ่น
      - name: หมูบาบีคิว
        price: 0
        ingredient: หมูบาบีคิว
      - name: ไก่ทอดเกาหลี
        price: 0
        ingredient: ไก่ทอดเกาหลี
    - name: ราดเพิ่ม
      kind: choice
      min: 0
      max: 2
      options:
