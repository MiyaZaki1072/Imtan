# ข้อมูลร้านสำหรับเดโม (seed) — อิ่มทัน · schema v2 (ตรงกับ PLAN.md §4a ทุก key)
# ไฟล์นี้สร้างจากสคริปต์ และผ่านการตรวจความถูกต้องแล้ว:
#   - ทุกเมนูมีแหล่งราคาเดียว: variants (ตารางราคารายชุด) หรือ tier_prices (กลุ่ม tiered) หรือ base_price
#   - ตารางราคามีครบทุกชุดของกลุ่ม variant, กลุ่ม variant และ choice แบบเลือก 1 มีค่าเริ่มต้น 1 ตัว
#   - ingredient ทุกตัวที่อ้างถึงอยู่ในรายการ ingredients ของร้าน
#   - ราคาบวกเพิ่ม (price) มีได้เฉพาะ option ในกลุ่ม kind = choice
# confirmed = มาจาก research ของทีม · assumed = สมมติ แม่ค้าแก้ได้ในแอป
# ห้ามเดาเพิ่ม: ถ้าข้อมูลไม่พอ ให้ถามทีม
schema_version: 2
units:
  price: baht (seed × 100 → satang)
  cook_seconds: seconds per item
  manual_seconds_per_item: seconds per item, used when wait_mode = manual
shops:
- slug: pi-som
  name: ไก่กรอบ ซอย 9 พี่ส้ม
  category: ข้าวราดของทอด
  queue_prefix: ส้ม
  wait_mode: auto
  manual_seconds_per_item: 90
  confirmed:
  - ชื่อร้าน
  - ข้าวราดทุกจาน
  - โปรตีน 1 อย่าง ฿50 / 2 อย่าง ฿60
  - ทุกโปรตีนราคาเท่ากัน
  - รายการโปรตีน (เท่าที่จำได้)
  - ไข่ข้น/แกงกะหรี่ เป็น add-on เลือกได้ทั้งสองหรือไม่เอา
  - สั่งโปรตีนอย่างเดียวได้ (ราคาไม่ทราบ)
  assumed:
  - ไข่ข้น/แกงกะหรี่ +฿10
  - โปรตีนอย่างเดียว ฿45/฿55
  - เลือกโปรตีนสูงสุด 2 อย่าง
